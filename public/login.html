<!doctype html>
<!-- Served without the cookie (see Caddyfile), so it carries its own styles and script: the app's bundle stays behind the gate. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="robots" content="noindex" />
    <title>Вход — DocScan</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #fff;
        --frame: #f5f5f5;
        --card: #fff;
        --line: rgba(0, 0, 0, 0.06);
        --field: #f3f3f3;
        --text: #171717;
        --muted: #8a8a8a;
        --icon: #9a9a9a;
        --button: #111;
        --on-button: #fff;
        --error: #dc2626;
        --focus-ring: #b45309;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --frame: #171717;
          --card: #1f1f1f;
          --line: rgba(255, 255, 255, 0.08);
          --field: #2a2a2a;
          --text: #fafafa;
          --muted: #a3a3a3;
          --icon: #8a8a8a;
          --button: #ececec;
          --on-button: #171717;
          --error: #f87171;
          --focus-ring: #f6821f;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        width: 100%;
        max-width: 380px;
        padding: 6px 6px 0;
        border-radius: 28px;
        background: var(--frame);
        border: 1px solid var(--line);
      }
      .card {
        padding: 28px 24px 24px;
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
        text-align: center;
      }
      .logo {
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
      }
      .logo span {
        position: relative;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        /* One solid colour, the button's: a flat mark, no gradient tile. */
        color: var(--on-button);
        background: var(--button);
      }
      h1 { margin: 0 0 24px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      form { display: grid; gap: 10px; }
      .field { position: relative; }
      .field > svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--icon); pointer-events: none; }
      input {
        width: 100%;
        height: 42px;
        padding: 0 40px 0 38px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--field);
        color: var(--text);
        font: inherit;
        font-size: 16px; /* under 16px iOS Safari zooms the page in on focus */
        outline: none;
      }
      input::placeholder { color: var(--muted); }
      input:focus { border-color: var(--icon); }
      input[aria-invalid="true"] { border-color: var(--error); }
      .eye {
        position: absolute;
        right: 4px;
        top: 50%;
        translate: 0 -50%;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--icon);
        cursor: pointer;
      }
      .eye:hover { color: var(--text); }
      .submit {
        height: 42px;
        margin-top: 4px;
        border: 0;
        border-radius: 10px;
        background: var(--button);
        color: var(--on-button);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .submit:disabled { opacity: 0.6; cursor: progress; }
      :focus-visible:not(input) { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
      .error { min-height: 20px; margin: 2px 0 0; color: var(--error); font-size: 13px; }
      .error:empty { display: none; }
      .footer { margin: 0; padding: 14px 16px 16px; text-align: center; color: var(--muted); font-size: 14px; }
      .footer b { color: var(--text); font-weight: 500; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="card">
        <div class="logo" aria-hidden="true">
          <span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><path d="M7 12h10" />
            </svg>
          </span>
        </div>
        <h1>Войдите, чтобы продолжить</h1>
        <form id="login" novalidate>
          <div class="field">
            <label for="email" class="sr-only">Email</label>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            <input id="email" type="email" placeholder="Email" autocomplete="username" required aria-describedby="error" />
          </div>
          <div class="field">
            <label for="password" class="sr-only">Пароль</label>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required aria-describedby="error" />
            <button type="button" class="eye" id="eye" aria-label="Показать пароль" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <button type="submit" class="submit">Войти</button>
          <p class="error" id="error" role="alert"></p>
        </form>
      </div>
      <p class="footer">Нет доступа? <b>Попросите у администратора</b></p>
    </main>
    <script>
      const form = document.getElementById("login")
      const email = document.getElementById("email")
      const password = document.getElementById("password")
      const eye = document.getElementById("eye")
      const error = document.getElementById("error")
      const submit = form.querySelector(".submit")

      eye.addEventListener("click", () => {
        const show = password.type === "password"
        password.type = show ? "text" : "password"
        eye.setAttribute("aria-pressed", String(show))
        eye.setAttribute("aria-label", show ? "Скрыть пароль" : "Показать пароль")
      })

      const fail = (message) => {
        error.textContent = message
        for (const input of [email, password]) input.setAttribute("aria-invalid", "true")
      }

      // Same string scripts/auth-key.sh hashes; the server only compares the hash with AUTH_KEYS.
      async function key(mail, pass) {
        const bytes = new TextEncoder().encode(`docscan\n${mail.replace(/\s/g, "").toLowerCase()}\n${pass}`)
        const hash = await crypto.subtle.digest("SHA-256", bytes)
        return [...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, "0")).join("")
      }

      const setCookie = (value, maxAge) =>
        (document.cookie = `docscan_key=${value}; Path=/; Max-Age=${maxAge}; SameSite=Lax${location.protocol === "https:" ? "; Secure" : ""}`)

      form.addEventListener("submit", async (e) => {
        e.preventDefault()
        error.textContent = ""
        if (!email.value.trim() || !password.value) return fail("Введите email и пароль.")
        submit.disabled = true
        try {
          setCookie(await key(email.value, password.value), 60 * 60 * 24 * 30)
          // The server redirects back here unless the key is on its list.
          const res = await fetch("/", { redirect: "manual", cache: "no-store" })
          if (res.type === "opaqueredirect" || !res.ok) {
            setCookie("", 0)
            fail("Неверный email или пароль.")
          } else location.replace("/")
        } catch {
          setCookie("", 0)
          fail("Не получилось проверить вход. Проверьте интернет и попробуйте ещё раз.")
        } finally {
          submit.disabled = false
        }
      })
    </script>
  </body>
</html>
